<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{plugin:PluginIssues:fragments/layout :: layoutHtml(title = '创建新Issue',
content = ~{::content}, version = ${pluginVersion}, head = ~{::head})}">
<th:block th:fragment="head">

</th:block>
<th:block th:fragment="content" th:with="currentUser = ${contributorFinder.getContributor(#authentication.name)}">
    <th:block th:replace="~{fragments/global-header::header(
        totalIssue = ${issueStats.totalIssue}, activeTab = 'issues')}" />
    <main class="piw-container piw-mx-auto piw-py-6 piw-flex lg:piw-flex-nowrap lg:piw-gap-x-4 piw-flex-wrap"
        x-data="{templateName: main.getSpecialParam('template'), issueTemplateModal: false}">
        <!-- 表单提交部分  -->
        <div class="lg:piw-w-[68%] piw-w-full" x-data="issueSubmit(templateName)">
            <div class="piw-w-full piw-space-y-0.5">
                <p class="piw-tracking-wider piw-font-bold">创建新 Issue</p>
                <div class="piw-flex piw-items-center piw-gap-x-1 piw-h-6" x-show="templateName != ''">
                    <p class="piw-text-xs" th:text="${selectedIssueTemplate.displayName}"></p>
                    <button type="button"
                        class="piw-outline-none piw-text-xs piw-text-blue-500 hover:piw-border-b hover:piw-border-blue-500 piw-transition-all duration-300"
                        @click="issueTemplateModal = true">选择其他模版</button>
                </div>
            </div>
            <!-- 模版选择   -->
            <th:block th:if="${not #lists.isEmpty(issueTemplates.issueTemplateOptions)}">
                <th:block th:replace="~{fragments/issue-template-select}" />
            </th:block>
            <!-- 基础信息表单  -->
            <form class="piw-w-full piw-rounded piw-py-4 piw-space-y-6" x-data="issueEditor"
                @submit="submitForm(rawContent, preview)">
                <!-- 标题 -->
                <div>
                    <label class="piw-block piw-text-sm piw-font-medium piw-mb-1" for="title">
                        标题 <span class="piw-text-red-500">*</span>
                    </label>
                    <input id="title" x-model="issueForm.spec.title" type="text" required
                        class="piw-w-full piw-text-sm piw-border piw-border-gray-300 piw-rounded-md piw-py-2 piw-px-2 piw-focus:outline-none piw-focus:ring-2 piw-focus:ring-blue-400 piw-transition"
                        placeholder="请输入标题">
                </div>
                <!-- 模版表单：服务端优先渲染，避免前端二次请求失败后退化为普通表单 -->
                <div class="piw-space-y-4" th:if="${not #lists.isEmpty(selectedIssueTemplate.components)}">
                    <div class="piw-w-full piw-space-y-1"
                         th:each="component : ${selectedIssueTemplate.components}">
                        <!-- 初始化模板字段值。使用 data-* 传值，避免默认值中的引号破坏 Alpine 表达式。 -->
                        <span class="piw-hidden"
                              th:data-field-key="${component.key}"
                              th:data-field-type="${component.type.name()}"
                              th:data-default-value="${component.defaultValue}"
                              x-init="const key = $el.dataset.fieldKey; const type = $el.dataset.fieldType; const value = $el.dataset.defaultValue || ''; if (!(key in issueForm.metadata.annotations)) { issueForm.metadata.annotations[key] = type === 'RADIO' ? (value ? [value] : []) : value; }"></span>

                        <label class="piw-block piw-text-sm piw-font-medium piw-mb-1" th:for="${component.key}">
                            <span th:text="${component.title}"></span>
                            <span class="piw-text-red-500" th:if="${component.requiredMode == 'required'}">*</span>
                        </label>

                        <th:block th:switch="${component.type.name()}">
                            <input th:case="'TEXT'"
                                   th:id="${component.key}" type="text"
                                   th:maxlength="${component.maxLength != null and component.maxLength > 0 ? component.maxLength : null}"
                                   th:minlength="${component.minLength != null and component.minLength > 0 ? component.minLength : null}"
                                   th:required="${component.requiredMode == 'required'}"
                                   th:placeholder="${component.placeholder}"
                                   th:attr="x-model=|issueForm.metadata.annotations['${component.key}']|"
                                   class="piw-w-full piw-text-sm piw-border piw-border-gray-300 piw-rounded-md piw-py-2 piw-px-2 piw-focus:outline-none piw-focus:ring-2 piw-focus:ring-blue-400" />

                            <input th:case="'PASSWORD'"
                                   th:id="${component.key}" type="password"
                                   th:required="${component.requiredMode == 'required'}"
                                   th:placeholder="${component.placeholder}"
                                   th:attr="x-model=|issueForm.metadata.annotations['${component.key}']|"
                                   class="piw-w-full piw-text-sm piw-border piw-border-gray-300 piw-rounded-md piw-py-2 piw-px-2 piw-focus:outline-none piw-focus:ring-2 piw-focus:ring-blue-400" />

                            <input th:case="'EMAIL'"
                                   th:id="${component.key}" type="email"
                                   th:required="${component.requiredMode == 'required'}"
                                   th:placeholder="${component.placeholder}"
                                   th:attr="x-model=|issueForm.metadata.annotations['${component.key}']|"
                                   class="piw-w-full piw-text-sm piw-border piw-border-gray-300 piw-rounded-md piw-py-2 piw-px-2 piw-focus:outline-none piw-focus:ring-2 piw-focus:ring-blue-400" />

                            <textarea th:case="'TEXT_AREA'"
                                      th:id="${component.key}"
                                      th:rows="${component.rows != null and component.rows > 0 ? component.rows : 3}"
                                      th:maxlength="${component.maxLength != null and component.maxLength > 0 ? component.maxLength : null}"
                                      th:minlength="${component.minLength != null and component.minLength > 0 ? component.minLength : null}"
                                      th:required="${component.requiredMode == 'required'}"
                                      th:placeholder="${component.placeholder}"
                                      th:attr="x-model=|issueForm.metadata.annotations['${component.key}']|"
                                      class="piw-w-full piw-text-sm piw-border piw-border-gray-300 piw-rounded-md piw-p-2 piw-focus:outline-none piw-focus:ring-2 piw-focus:ring-blue-400"></textarea>

                            <select th:case="'SELECT'"
                                    th:id="${component.key}"
                                    th:required="${component.requiredMode == 'required'}"
                                    th:attr="x-model=|issueForm.metadata.annotations['${component.key}']|"
                                    class="piw-w-full piw-text-sm piw-border piw-border-gray-300 piw-rounded-md piw-py-2 piw-px-2 piw-bg-white piw-focus:outline-none piw-focus:ring-2 piw-focus:ring-blue-400">
                                <option value="" th:text="${#strings.isEmpty(component.placeholder) ? '请选择' : component.placeholder}"></option>
                                <option th:each="option : ${component.fieldOptions}"
                                        th:value="${option['generateVal']}"
                                        th:text="${option['label']}"></option>
                            </select>

                            <div th:case="'RADIO'" class="piw-flex piw-flex-wrap piw-gap-2">
                                <label th:each="option : ${component.fieldOptions}"
                                       class="piw-inline-flex piw-items-center piw-px-2 piw-py-1 piw-border piw-border-gray-300 piw-rounded piw-cursor-pointer hover:piw-bg-blue-50">
                                    <input type="checkbox" class="piw-mr-1"
                                           th:value="${option['generateVal']}"
                                           th:attr="x-model=|issueForm.metadata.annotations['${component.key}']|" />
                                    <span class="piw-text-sm piw-tracking-wider" th:text="${option['label']}"></span>
                                </label>
                            </div>
                        </th:block>

                        <p class="piw-text-sm piw-text-neutral-500 piw-mt-1"
                           th:if="${not #strings.isEmpty(component.helpText)}"
                           th:text="${component.helpText}"></p>
                    </div>
                </div>
                <div class="piw-rounded-md piw-border piw-border-amber-200 piw-bg-amber-50 piw-p-3 piw-text-sm piw-text-amber-700"
                     th:if="${not #strings.isEmpty(selectedTemplateName) and #lists.isEmpty(selectedIssueTemplate.components)}">
                    已选择模板，但未读取到模板字段。请检查该模板是否保存了布局组件。
                </div>
                <!-- 描述 -->
                <div>
                    <label class="piw-block piw-text-sm piw-font-medium piw-mb-2">描述</label>
                    <th:block th:replace="~{fragments/IssueEditor}" />
                </div>
                <!-- 提交按钮 -->
                <div class="piw-w-full piw-flex piw-justify-between piw-items-center" x-data="diceBearAvatar(avatarStyle,size)">
                    <div class="piw-w-10" th:attr="x-data=|{ issueOwnerName: '${currentUser.name}'}|">
                        <th:block
                            th:replace="~{fragments/macro/ownerAvatar::ownerAvatar(avatar = ${currentUser.avatar}, name=${currentUser.name})}" />
                    </div>
                    <div class="piw-flex piw-justify-end piw-space-x-2">
                        <button type="button"
                            class="piw-bg-gray-100 piw-text-gray-600 piw-text-sm piw-px-3 piw-py-1 piw-rounded-md piw-border piw-border-gray-200 piw-transition hover:piw-bg-gray-200"
                            @click="cancelCreate()">取消</button>
                        <button type="submit" :disabled="saveLoading || rawContent.trim() == ''"
                                @mouseenter="if(rawContent.trim() == ''){main.showTooltip('请填入Issue描述', $event)}"
                                @mouseleave="if(rawContent.trim() == ''){main.hideTooltip()}"
                                :class="{'piw-cursor-not-allowed piw-opacity-60': saveLoading || rawContent.trim() == ''}"
                            class="piw-bg-green-600 piw-px-4 piw-py-1 piw-rounded-md piw-shadow-sm piw-transition hover:piw-bg-green-700 transition-all duration-300 inline-flex items-center gap-x-1">
                            <span class="text-lg piw-icon-[eos-icons--loading]" x-show="saveLoading"></span>
                            <span x-text="submitText" class="piw-text-white piw-text-sm"></span>
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <!--  右侧信息栏 -->
        <div class="lg:piw-w-[28%] lg:piw-sticky piw-w-full piw-h-full piw-space-y-2 piw-divide-y piw-divide-slate-200">
            <div class="piw-space-y-2 piw-py-3">
                <p class="piw-text-sm piw-tracking-wider">经办人</p>
                <p class="piw-text-sm piw-tracking-wider piw-text-neutral-400">
                    暂无经办人
                </p>
            </div>
            <div class="piw-space-y-2 piw-py-3">
                <p class="piw-text-sm piw-tracking-wider">标签</p>
                <p class="piw-text-sm piw-tracking-wider piw-text-neutral-400">
                    暂无标签
                </p>
            </div>
        </div>
    </main>
</th:block>

</html>
