<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{plugin:PluginIssues:fragments/layout :: layoutHtml(title = 'Issues',
      content = ~{::content}, version = ${pluginVersion}, head = null)}">
<th:block th:fragment="content">
    <th:block th:replace="~{fragments/global-header::header(
        totalIssue = ${issueStats.totalIssue}, activeTab = 'issues')}" />
    <main class="piw-container piw-mx-auto piw-space-y-4 piw-py-6"
          x-data="{issueTemplateModal: false, searchResShow: false, searchHits: {}}">
        <div class="piw-flex piw-w-full piw-items-center piw-gap-x-3">
            <div class="piw-relative piw-w-full" x-data="{keyword: ''}"
                 x-effect="if(!keyword){searchResShow = false}">
                <input type="search" placeholder="搜索 Issue..."
                       x-model="keyword" name="keyword"
                       @keydown.enter="searchHits=await main.searchIssueByKeyword(keyword);searchResShow=true"
                       class="piw-w-full piw-rounded-lg piw-border piw-border-gray-300 piw-py-2 piw-pl-10 piw-pr-4 piw-text-sm piw-transition-all">
                <span class="piw-icon-[mingcute--list-search-line] piw-absolute piw-left-3 piw-top-2.5 piw-size-4 piw-text-gray-400"></span>
            </div>
            <a sec:authorize="isAuthenticated()"
               th:if="${#lists.isEmpty(issueTemplates.issueTemplateOptions)}"
               href="/issues/new"
               class="piw-flex piw-h-9 piw-w-[112px] piw-items-center piw-justify-center piw-rounded-md piw-bg-green-700 piw-px-3 piw-text-sm piw-text-white">
                新建 Issue
            </a>
            <button sec:authorize="isAuthenticated()"
                    th:unless="${#lists.isEmpty(issueTemplates.issueTemplateOptions)}"
                    type="button" @click="issueTemplateModal = true"
                    class="piw-h-9 piw-w-[112px] piw-rounded-md piw-bg-green-700 piw-px-3 piw-text-sm piw-text-white">
                新建 Issue
            </button>
            <a sec:authorize="isAnonymous()" href="/login"
               onclick="this.href='/login?redirect_uri='+encodeURIComponent(window.location.origin+'/issues/new')"
               class="piw-flex piw-h-9 piw-w-[112px] piw-items-center piw-justify-center piw-rounded-md piw-bg-green-700 piw-px-3 piw-text-sm piw-text-white">
                登录后新建
            </a>
        </div>

        <th:block th:if="${not #lists.isEmpty(issueTemplates.issueTemplateOptions)}">
            <th:block th:replace="~{fragments/issue-template-select}" />
        </th:block>

        <section x-show="!searchResShow"
                 class="piw-overflow-hidden piw-rounded-md piw-border piw-border-slate-200 piw-bg-slate-100">
            <div class="piw-flex piw-w-full piw-items-center piw-justify-between piw-gap-x-3 piw-overflow-x-auto piw-border-b piw-border-neutral-200 piw-px-3 piw-py-2">
                <div class="piw-flex piw-items-center piw-gap-x-2"
                     x-data="{curIssueState: main.getSpecialParam('issueState') || 'all'}">
                    <a class="issue-wrapper-stats" href="/issues?issueState=all"
                       :class="{'piw-rounded-full piw-border piw-border-slate-300/80 piw-px-3':curIssueState==='all'}">
                        <span class="piw-text-sm piw-font-bold">全部</span>
                        <span class="issue-wrapper-stats-num" th:text="${issueStats.totalIssue}">0</span>
                    </a>
                    <a class="issue-wrapper-stats" href="/issues?issueState=PROGRESS"
                       :class="{'piw-rounded-full piw-border piw-border-slate-300/80 piw-px-3':curIssueState==='PROGRESS'}">
                        <span class="piw-text-sm piw-font-bold">处理中</span>
                        <span class="issue-wrapper-stats-num" th:text="${issueStats.progressIssue}">0</span>
                    </a>
                    <a class="issue-wrapper-stats" href="/issues?issueState=AWAIT"
                       :class="{'piw-rounded-full piw-border piw-border-slate-300/80 piw-px-3':curIssueState==='AWAIT'}">
                        <span class="piw-text-sm piw-font-bold">等待中</span>
                        <span class="issue-wrapper-stats-num" th:text="${issueStats.awaitIssue}">0</span>
                    </a>
                    <a class="issue-wrapper-stats" href="/issues?issueState=CLOSED"
                       :class="{'piw-rounded-full piw-border piw-border-slate-300/80 piw-px-3':curIssueState==='CLOSED'}">
                        <span class="piw-text-sm piw-font-bold">已关闭</span>
                        <span class="issue-wrapper-stats-num" th:text="${issueStats.closedIssue}">0</span>
                    </a>
                </div>
            </div>
            <div class="piw-divide-y piw-divide-slate-200">
                <th:block th:each="issueItem : ${issueItems.items}"
                          th:unless="${#lists.isEmpty(issueItems.items)}">
                    <th:block th:replace="~{fragments/macro/issue-item::issueItem(issueVO=${issueItem})}" />
                </th:block>
                <div th:if="${#lists.isEmpty(issueItems.items)}"
                     class="piw-flex piw-w-full piw-flex-col piw-items-center piw-justify-center piw-bg-white piw-px-4 piw-py-10">
                    <img th:src="@{/plugins/PluginIssues/assets/static/img/empty.svg}"
                         alt="暂无 Issue" width="128">
                    <p class="piw-text-sm piw-text-neutral-500">当前没有匹配的 Issue</p>
                </div>
            </div>
        </section>

        <section x-show="searchResShow" class="piw-w-full piw-space-y-2" x-data="dateUtils">
            <p class="piw-text-sm piw-text-neutral-700"
               x-text="`找到 ${searchHits.total || 0} 条相关 Issue`"></p>
            <div x-show="searchHits.hits && searchHits.hits.length===0"
                 class="piw-flex piw-w-full piw-flex-col piw-items-center piw-rounded-md piw-border piw-border-neutral-200 piw-bg-white piw-px-4 piw-py-8">
                <p class="piw-text-sm piw-text-neutral-500">没有匹配的 Issue</p>
            </div>
            <div x-show="searchHits.hits && searchHits.hits.length>0"
                 class="piw-divide-y piw-divide-slate-200 piw-overflow-hidden piw-rounded-md piw-border piw-border-neutral-200">
                <template x-for="searchItem in searchHits.hits" :key="searchItem.metadataName">
                    <div class="piw-flex piw-items-center piw-justify-between piw-bg-white piw-px-4 piw-py-3">
                        <div class="piw-space-y-1">
                            <a class="piw-text-base piw-font-medium piw-text-neutral-800"
                               :href="searchItem.permalink" x-html="searchItem.title"></a>
                            <p class="piw-text-xs piw-text-neutral-500"
                               x-text="`${searchItem.ownerName} · ${formatDatetime(searchItem.updateTimestamp)}`"></p>
                        </div>
                    </div>
                </template>
            </div>
        </section>

        <div x-show="!searchResShow" class="piw-flex piw-w-full piw-items-center piw-justify-center">
            <th:block th:replace="~{fragments/pagination::pagination(
                context = '/issues/', prevUrl = ${issueItems.prevUrl},
                nextUrl = ${issueItems.nextUrl}, totalPages = ${issueItems.totalPages},
                page = ${issueItems.page}, hasPrevious = ${issueItems.hasPrevious()},
                hasNext = ${issueItems.hasNext()})}" />
        </div>
    </main>
</th:block>
</html>
