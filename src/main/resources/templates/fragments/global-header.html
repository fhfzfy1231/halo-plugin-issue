<!-- 全局 Issue 前台顶部导航 -->
<header th:fragment="header(totalIssue, activeTab)"
        class="piw-w-full piw-border-b piw-border-slate-200 piw-bg-slate-50">
    <div class="piw-container piw-mx-auto piw-space-y-3 piw-pt-4">
        <div class="piw-flex piw-items-center piw-justify-between">
            <a href="/issues" class="piw-flex piw-items-center piw-gap-x-3">
                <span class="piw-flex piw-size-9 piw-items-center piw-justify-center piw-rounded-lg piw-bg-green-700 piw-text-white">
                    <span class="piw-icon-[codicon--issues] piw-text-xl"></span>
                </span>
                <div>
                    <p class="piw-text-base piw-font-bold piw-text-slate-900">Issue</p>
                    <p class="piw-text-xs piw-text-slate-500">反馈、建议与问题追踪</p>
                </div>
            </a>
            <div class="piw-flex piw-items-center piw-gap-x-3">
                <a th:href="${siteHomeUrl}"
                   class="piw-text-sm piw-text-slate-600 hover:piw-text-slate-900">
                    返回首页
                </a>
                <a sec:authorize="isAuthenticated()" href="/console/issues/list"
                   class="piw-text-sm piw-text-slate-600 hover:piw-text-slate-900">
                    管理后台
                </a>
                <a sec:authorize="isAuthenticated()" href="/logout"
                   class="piw-text-sm piw-text-slate-600 hover:piw-text-slate-900">
                    退出
                </a>
                <a sec:authorize="isAnonymous()" href="/login"
                   onclick="this.href='/login?redirect_uri='+encodeURIComponent(window.location.href)"
                   class="piw-text-sm piw-font-medium piw-text-green-700 hover:piw-text-green-800">
                    登录
                </a>
            </div>
        </div>
        <nav class="piw-flex piw-items-center piw-gap-x-2">
            <a href="/issues"
               class="tab-transfer piw-duration-300"
               th:classappend="${#strings.equals(activeTab, 'issues') ? 'tab-transfer-active' : ''}">
                <span class="piw-icon-[codicon--issues] piw-text-xl"></span>
                <span class="piw-text-neutral-800">Issues</span>
                <span class="piw-ml-1 piw-rounded-lg piw-bg-neutral-200 piw-px-2 piw-py-0.5 piw-text-xs piw-text-neutral-700"
                      th:text="${totalIssue}">0</span>
            </a>
        </nav>
    </div>
</header>
